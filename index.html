<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos del Torneo</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-card {
            background-color: #1a1d2d;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info-pista {
            font-size: 0.75rem;
            color: #ff477e;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .match-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .team {
            font-weight: bold;
            font-size: 0.95rem;
            width: 38%;
            text-align: center;
            word-break: break-word;
        }
        .score-pending {
            background-color: #262a3d;
            color: #8b92af;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .score-played {
            background-color: #ccff00;
            color: #0f111a;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        .empty-state {
            text-align: center;
            color: #8b92af;
            padding: 30px;
            background: #1a1d2d;
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚔️ PARTIDOS DEL GRUPO</h2>
        <div id="lista-partidos">
            <div class="empty-state">Sincronizando con Google Sheets...</div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFWrz0r94Rt5HcGwoCGSKwkChlJ_bZ925qQJd46GQSCohRPNfmVl7VkeCJDBkM_eQM4g/exec";

        async function cargarPartidos() {
            try {
                let response = await fetch(WEB_APP_URL);
                let filas = await response.json();
                
                let contenedor = document.getElementById("lista-partidos");
                contenedor.innerHTML = ""; 

                if (!filas || filas.length <= 1) {
                    contenedor.innerHTML = `<div class="empty-state">El Excel devuelve datos vacíos o solo la cabecera.</div>`;
                    return;
                }

                let partidosEncontrados = 0;

                // Recorremos las filas del Excel
                for (let i = 1; i < filas.length; i++) {
                    let fila = filas[i];
                    
                    // --- CAMBIA ESTOS NÚMEROS SEGÚN EN QUÉ COLUMNA ESTÁ CADA COSA ---
                    // [0] es la primera columna (A), [1] la B, [2] la C, [3] la D, [4] la E...
                    let horaPista = fila[0] || "PISTA 35 · 10:00 H"; 
                    let pareja1  = fila[1]; // Columna B
                    let pareja2  = fila[2]; // Columna C
                    let goles1   = fila[3]; // Columna D (Resultado 1)
                    let goles2   = fila[4]; // Columna E (Resultado 2)

                    // Si las columnas principales están vacías, probamos a saltar
                    if (!pareja1 && !pareja2) continue;

                    partidosEncontrados++;

                    // Comprobamos si hay resultado introducido
                    let hayResultado = (goles1 !== "" && goles1 !== null && goles1 !== undefined && 
                                        goles2 !== "" && goles2 !== null && goles2 !== undefined);
                    
                    let htmlMarcador = hayResultado 
                        ? `<div class="score-played">${goles1}-${goles2}</div>` 
                        : `<div class="score-pending">-:-</div>`;

                    let tarjeta = document.createElement("div");
                    tarjeta.className = "match-card";
                    tarjeta.innerHTML = `
                        <div style="width: 100%;">
                            <div class="info-pista">📍 ${horaPista}</div>
                            <div class="match-content">
                                <span class="team">${pareja1 || "Por definir"}</span>
                                ${htmlMarcador}
                                <span class="team">${pareja2 || "Por definir"}</span>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                }

                if (partidosEncontrados === 0) {
                    contenedor.innerHTML = `<div class="empty-state">Se leyeron ${filas.length} filas pero ninguna tiene formato de partido válido. Revisa el orden de las columnas.</div>`;
                }

            } catch (error) {
                console.error("Error al sincronizar con Google Sheets:", error);
                document.getElementById("lista-partidos").innerHTML = `<div class="empty-state" style="color: #ff477e;">Error al conectar con la API de Google.</div>`;
            }
        }

        cargarPartidos();
        setInterval(cargarPartidos, 15000);
    </script>

</body>
</html>
