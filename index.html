<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos del Torneo</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-card {
            background-color: #1a1d2d;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info-pista {
            font-size: 0.75rem;
            color: #ff477e;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .match-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .team {
            font-weight: bold;
            font-size: 0.95rem;
            width: 38%;
            text-align: center;
            word-break: break-word;
        }
        .score-pending {
            background-color: #262a3d;
            color: #8b92af;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .score-played {
            background-color: #ccff00;
            color: #0f111a;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        .empty-state {
            text-align: center;
            color: #8b92af;
            padding: 30px;
            background: #1a1d2d;
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚔️ PARTIDOS DEL GRUPO</h2>
        <div id="lista-partidos">
            <div class="empty-state">Sincronizando partidos...</div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFWrz0r94Rt5HcGwoCGSKwkChlJ_bZ925qQJd46GQSCohRPNfmVl7VkeCJDBkM_eQM4g/exec";

        async function cargarPartidos() {
            try {
                let response = await fetch(WEB_APP_URL);
                let filas = await response.json();
                
                let contenedor = document.getElementById("lista-partidos");
                contenedor.innerHTML = ""; 

                if (!filas || filas.length === 0) {
                    contenedor.innerHTML = `<div class="empty-state">No se han encontrado datos en el Excel.</div>`;
                    return;
                }

                let partidosEncontrados = 0;

                // En JavaScript las columnas empiezan en 0:
                // Columna I = Índice 8 (Pareja 1)
                // Columna J = Índice 9 (Hora)
                // Columna K = Índice 10 (Resultado 1)
                // Columna M = Índice 12 (Resultado 2)
                // Columna N = Índice 13 (Pareja 2)

                for (let i = 0; i < filas.length; i++) {
                    let fila = filas[i];
                    
                    let horaPista = fila[9];  // Columna J (Hora)
                    let pareja1  = fila[8];  // Columna I (Pareja 1)
                    let goles1   = fila[10]; // Columna K (Resultado 1)
                    let goles2   = fila[12]; // Columna M (Resultado 2)
                    let pareja2  = fila[13]; // Columna N (Pareja 2)

                    // Filtramos para asegurarnos de que cogemos solo las filas que tienen parejas asignadas
                    if (!pareja1 || !pareja2 || pareja1 === "EQUIPO" || pareja1 === "PARTIDOS") continue;

                    partidosEncontrados++;

                    // Comprobación de si hay resultado introducido
                    let hayResultado = (goles1 !== "" && goles1 !== null && goles1 !== undefined && 
                                        goles2 !== "" && goles2 !== null && goles2 !== undefined &&
                                        !isNaN(goles1) && !isNaN(goles2));
                    
                    let htmlMarcador = hayResultado 
                        ? `<div class="score-played">${goles1}-${goles2}</div>` 
                        : `<div class="score-pending">-:-</div>`;

                    let tarjeta = document.createElement("div");
                    tarjeta.className = "match-card";
                    tarjeta.innerHTML = `
                        <div style="width: 100%;">
                            <div class="info-pista">📍 ${horaPista || "PARTIDO"}</div>
                            <div class="match-content">
                                <span class="team">${pareja1}</span>
                                ${htmlMarcador}
                                <span class="team">${pareja2}</span>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                }

                if (partidosEncontrados === 0) {
                    contenedor.innerHTML = `<div class="empty-state">El Excel está vacío de partidos en este momento. Se muestra limpio.</div>`;
                }

            } catch (error) {
                console.error("Error al sincronizar con Google Sheets:", error);
                document.getElementById("lista-partidos").innerHTML = `<div class="empty-state" style="color: #ff477e;">Error al conectar con la API.</div>`;
            }
        }

        cargarPartidos();
        setInterval(cargarPartidos, 15000);
    </script>

</body>
</html>
