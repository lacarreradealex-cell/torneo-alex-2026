<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos del Torneo</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-card {
            background-color: #1a1d2d;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info-pista {
            font-size: 0.75rem;
            color: #ff477e;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .match-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .team {
            font-weight: bold;
            font-size: 0.95rem;
            width: 38%;
            text-align: center;
            word-break: break-word;
        }
        /* Estilo para resultado pendiente (Gris) */
        .score-pending {
            background-color: #262a3d;
            color: #8b92af;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
        }
        /* Estilo para resultado jugado (Verde) */
        .score-played {
            background-color: #ccff00;
            color: #0f111a;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚔️ PARTIDOS DEL GRUPO</h2>
        <div id="lista-partidos">
            <!-- Los partidos se cargarán aquí automáticamente desde Google Sheets -->
            <p style="text-align: center; color: #8b92af;">Cargando partidos en tiempo real...</p>
        </div>
    </div>

    <script>
        // Tu URL real de Google Apps Script ya integrada
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFWrz0r94Rt5HcGwoCGSKwkChlJ_bZ925qQJd46GQSCohRPNfmVl7VkeCJDBkM_eQM4g/exec";

        async function cargarPartidos() {
            try {
                let response = await fetch(WEB_APP_URL);
                let filas = await response.json();
                
                let contenedor = document.getElementById("lista-partidos");
                contenedor.innerHTML = ""; // Limpiar antes de actualizar

                // Empezamos en i = 1 para saltarnos la cabecera (fila 0) de tu Excel
                for (let i = 1; i < filas.length; i++) {
                    let horaPista = filas[i][0] || "PISTA · 10:00 H"; // Columna A (Hora/Pista)
                    let pareja1  = filas[i][1]; // Columna B: Pareja 1
                    let pareja2  = filas[i][2]; // Columna C: Pareja 2
                    let goles1   = filas[i][3]; // Columna D: Resultado 1
                    let goles2   = filas[i][4]; // Columna E: Resultado 2

                    // Si la fila está totalmente vacía de parejas, la saltamos
                    if (!pareja1 && !pareja2) continue;

                    // COMPROBACIÓN: Si las celdas de resultados están vacías, muestra el gris "-:-"
                    let hayResultado = (goles1 !== "" && goles1 !== null && goles2 !== "" && goles2 !== "" && goles2 !== undefined);
                    
                    let htmlMarcador = hayResultado 
                        ? `<div class="score-played">${goles1}-${goles2}</div>` 
                        : `<div class="score-pending">-:-</div>`;

                    // Crear la tarjeta visual del partido
                    let tarjeta = document.createElement("div");
                    tarjeta.className = "match-card";
                    tarjeta.innerHTML = `
                        <div style="width: 100%;">
                            <div class="info-pista">📍 ${horaPista}</div>
                            <div class="match-content">
                                <span class="team">${pareja1}</span>
                                ${htmlMarcador}
                                <span class="team">${pareja2}</span>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                }
            } catch (error) {
                console.error("Error al sincronizar con Google Sheets:", error);
            }
        }

        // Cargar al abrir la web
        cargarPartidos();

        // Sincronizar automáticamente en tiempo real cada 15 segundos
        setInterval(cargarPartidos, 15000);
    </script>

</body>
</html>
