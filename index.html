<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Conexión</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }
        h2 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #ff477e;
        }
        .error-box {
            background-color: #1a1d2d;
            border-left: 4px solid #ff477e;
            border-radius: 8px;
            padding: 20px;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #ff8fa3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚠️ ERROR DE CONEXIÓN DETECTADO</h2>
        <div id="error-detalle" class="error-box">
            Probando conexión con Google Apps Script...
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFWrz0r94Rt5HcGwoCGSKwkChlJ_bZ925qQJd46GQSCohRPNfmVl7VkeCJDBkM_eQM4g/exec";

        async function probarConexion() {
            let cajaError = document.getElementById("error-detalle");
            try {
                let response = await fetch(WEB_APP_URL, { redirect: "follow" });
                
                if (!response.ok) {
                    throw new Error(`El servidor respondió con estado HTTP: ${response.status} ${response.statusText}`);
                }
                
                let datos = await response.json();
                cajaError.style.borderLeftColor = "#ccff00";
                cajaError.style.color = "#ccff00";
                cajaError.innerHTML = `¡Conexión exitosa! Se han leído ${datos.length} filas del Excel correctamente. El problema de CORS se ha superado.`;

            } catch (error) {
                cajaError.innerHTML = `<b>Error técnico capturado:</b><br><br>${error.message}<br><br><b>Causas probables:</b><br>- Asegúrate de que en Google Apps Script, al implementar, el acceso esté en <i>"Cualquier usuario"</i>.<br>- Comprueba que la función <i>doGet(e)</i> devuelva correctamente los datos en formato JSON.`;
            }
        }

        probarConexion();
    </script>

</body>
</html>
